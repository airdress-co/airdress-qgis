<?xml version="1.0" encoding="UTF-8"?>
<!--
  Airdress mark — square 512x512 monogram (a:).

  Variant role: the canonical source for sub-32px favicon outputs where
  the full "airdress:" wordmark becomes illegible. Renders the first
  letter of the wordmark (`a`) followed by the signal-teal colon (`:`)
  — the same treatment as the full wordmark, just abbreviated to one
  letter so it remains distinguishable at 16x16.

  Derived from: brand/wordmark/svg/airdress-colon-square-512.svg (1.3).
  Same glyph fills (chalk #F1EFE8 letter, signal #00D4AA colon, void
  #111110 background), same JetBrains Mono fallback stack. Letter
  sizing chosen so "a:" fills the safe area at 16x16 and 32x32 sizes.

  Consumers (rendered downstream by brand/wordmark/scripts/render-icons.mjs):
    - I-01 favicon.ico (16/32/48 multi-size)
    - I-02 favicon.svg (path-only copy of this file)
    - I-03 favicon-16x16.png
    - I-04 favicon-32x32.png
    - I-06 apple-touch-icon.png (180x180 — uses this mark for
      consistency on iOS home screen tiles)

  Larger icons (192x192+, OG, README banner) continue to source from
  the full-wordmark airdress-colon-square-512.svg.

  viewBox: "0 0 512 512".
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512"
     width="512"
     height="512">
  <rect x="0" y="0" width="512" height="512" fill="#111110"/>
  <text x="256"
        y="256"
        font-family="'JetBrains Mono', 'Fira Code', 'Cascadia Code', ui-monospace, monospace"
        font-size="320"
        font-weight="500"
        letter-spacing="-0.02em"
        fill="#F1EFE8"
        text-anchor="middle"
        dominant-baseline="central">a<tspan fill="#00D4AA">:</tspan></text>
</svg>
